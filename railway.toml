[build]
builder = "NIXPACKS"
buildCommand = "bun install --frozen-lockfile && bunx drizzle-kit push --config drizzle.config.ts --force && cd apps/google-auth && bun run build"

[deploy]
startCommand = "cd apps/google-auth && bun run dist/index.js"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
