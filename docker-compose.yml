version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teledrug-postgres
    environment:
      POSTGRES_USER: teledrug
      POSTGRES_PASSWORD: teledrug_secret_2024
      POSTGRES_DB: teledrug_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teledrug"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: